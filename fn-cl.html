<!DOCTYPE html>
<html lang="th" data-theme="bright">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find Number</title>
<style>
:root{
  --font: "Segoe UI","Leelawadee UI","Noto Sans Thai","Tahoma",system-ui,sans-serif;
  --r: 18px;
}
html[data-theme="bright"]{
  --bg:#FFF6E9; --surface:#FFFFFF; --surface2:#FFEFD6; --line:rgba(40,30,60,.12);
  --text:#231B33; --muted:#6E6680; --accent:#FF4D6D; --accent2:#3A86FF; --accent3:#F5B700;
  --ok:#1FAA6B; --bad:#E5383B; --ink-on-accent:#FFFFFF; --shadow:0 4px 0 rgba(35,27,51,.12);
}
html[data-theme="dark"]{
  --bg:#121419; --surface:#1C1F27; --surface2:#262A35; --line:rgba(255,255,255,.10);
  --text:#F3F2F7; --muted:#9BA1B0; --accent:#FF5C8A; --accent2:#4CC9F0; --accent3:#FFD23F;
  --ok:#3DDC97; --bad:#FF5A5F; --ink-on-accent:#121419; --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:clamp(16px,3vw,32px);padding-bottom:40px}
.wrap{max-width:980px;margin:0 auto}

/* monogram */
.mono{display:inline-grid;place-items:center;min-width:2.2em;height:2.2em;padding:0 .4em;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.02em;border:2px solid currentColor;line-height:1}
.mono.fill{background:currentColor}
.mono.fill span{color:var(--ink-on-accent)}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo .mark{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:var(--shadow)}
.logo h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:900;letter-spacing:-.01em}
.logo small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.ibtn{height:44px;padding:0 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.ibtn:active{transform:translateY(2px)}

/* cards */
.daily{display:flex;align-items:center;gap:18px;background:var(--accent2);color:#fff;border-radius:24px;padding:22px 24px;box-shadow:var(--shadow);text-align:left;width:100%;margin-bottom:18px}
html[data-theme="dark"] .daily{color:#121419}
.daily .big{font-size:clamp(20px,3vw,28px);font-weight:900}
.daily .sub{opacity:.9;font-weight:600;font-size:14px;margin-top:4px}
.daily .cal{width:64px;height:64px;border-radius:16px;border:3px solid currentColor;display:grid;place-items:center;font-weight:900;font-size:26px;flex:none}
.daily .go{margin-left:auto;font-weight:900;font-size:18px;border:3px solid currentColor;border-radius:14px;padding:10px 18px;flex:none}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mode{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:150px}
.mode:active,.daily:active{transform:translateY(3px);box-shadow:none}
.mode .mono{font-size:18px;align-self:flex-start}
.mode b{font-size:19px}
.mode span.d{color:var(--muted);font-size:14px;font-weight:600;line-height:1.35}
.mode .best{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{background:var(--surface2);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}

/* settings */
h2.title{font-size:26px;margin:0 0 18px;font-weight:900}
.group{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.group .lbl{font-weight:800;margin-bottom:10px;font-size:15px}
.group .hint{color:var(--muted);font-size:13px;margin-top:8px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 16px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:15px;border:2px solid transparent}
.seg button.on{background:var(--accent);color:var(--ink-on-accent)}
.seg input{width:90px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700}

/* game */
#game{background:var(--bg)}
.hud{display:flex;align-items:center;gap:10px;padding:10px clamp(10px,2vw,20px);background:var(--surface);border-bottom:2px solid var(--line);position:relative;z-index:3}
.hud .ibtn{height:48px;min-width:48px;justify-content:center}
.target{display:flex;align-items:center;gap:12px;margin:0 auto}
.target .lab{font-weight:800;color:var(--muted);font-size:14px}
.target .num{position:relative;overflow:hidden;min-width:84px;height:52px;padding:0 14px;border-radius:14px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font-size:30px;font-weight:900;transition:transform .12s, background .2s}
.callout{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;pointer-events:none;
  min-width:1.5em;padding:.08em .3em;border-radius:.18em;background:var(--accent);color:var(--ink-on-accent);
  font-size:min(34vw,38vh);font-weight:900;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 .06em 0 rgba(0,0,0,.18)}
.callout.on{display:block;animation:callIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes callIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.board.dim .tile{opacity:.18;transition:opacity .25s}
.target .num.pop{transform:scale(1.15)}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:86px}
.stat .t{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .t.warn{color:var(--bad)}
.stat .m{display:flex;gap:4px;margin-top:2px;min-height:10px}
.stat .m i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.stat .m i.x{background:var(--bad)}
.stat .m em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.prog{height:5px;background:var(--surface2);position:relative;z-index:3}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:0;transition:width .2s}
.board{flex:1;position:relative;overflow:hidden;margin:8px}
.board.hidden .tile{visibility:hidden}
.tile{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg));font-size:calc(var(--cell) * .46 * var(--s,1));font-weight:900;line-height:1;padding:.18em .28em;border-radius:.3em;font-variant-numeric:tabular-nums;transition:opacity .35s, transform .35s;touch-action:manipulation}
.tile.imgt{padding:.06em}
.tile img{display:block;width:calc(var(--cell) * .74 * var(--s,1));height:calc(var(--cell) * .74 * var(--s,1));object-fit:contain;pointer-events:none}
.gridwrap .tile img{width:78%;height:78%}
.target .num img{width:40px;height:40px;object-fit:contain;display:block}
.target .num.im,.callout.im{background:var(--surface);border:2px solid var(--accent)}
.callout img{width:1.4em;height:1.4em;object-fit:contain;display:block;margin:.05em}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
.tile.ul span{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
.tile.found{pointer-events:none;animation:foundOut .32s ease-out forwards}
@keyframes foundOut{0%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.2);opacity:0}}
.star{position:absolute;width:calc(var(--cell) * .55);height:calc(var(--cell) * .55);background:var(--accent3);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);pointer-events:none;z-index:4;transform:translate(-50%,-50%) scale(0);animation:ping .5s ease-out forwards}
.star.s2{width:calc(var(--cell) * .26);height:calc(var(--cell) * .26);animation-delay:.07s;background:var(--accent2)}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(0) rotate(0)}40%{transform:translate(-50%,-50%) scale(1.15) rotate(30deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.2) rotate(70deg);opacity:0}}
.tile.wrong{animation:shake .4s}
.tile.hint{animation:pulse .5s 3}
.tile.masked span{display:none}
.tile.masked{width:calc(var(--cell) * .36);height:calc(var(--cell) * .36);padding:0;border-radius:50%;background:var(--surface2);border:2px solid var(--line);transform:translate(-50%,-50%)}
.gridwrap .tile.masked{width:auto;height:auto;border-radius:12px}
.gridwrap .tile.masked::after{content:"";width:18%;height:18%;border-radius:50%;background:var(--muted)}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}50%{translate:6px}75%{translate:-4px}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent3)}50%{box-shadow:0 0 0 .18em var(--accent3)}}
/* grid mode */
.gridwrap{position:absolute;inset:0;display:grid;gap:var(--ggap,6px)}
.gridwrap .tile{position:relative;left:auto;top:auto;transform:none;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);border-radius:min(14px,calc(var(--cell) * .14));padding:0;font-size:calc(var(--cell) * .46);width:100%;height:100%;min-width:0;min-height:0}
.gridwrap .tile.found{animation:gridOut .32s ease-out forwards}
@keyframes gridOut{0%{transform:scale(1);opacity:1}60%{transform:scale(1.2);opacity:.5}100%{transform:scale(1);opacity:.18}}
.gridwrap .empty{visibility:hidden}
.board.peeking .tile:not(.found){animation:peekIn .25s}
@keyframes peekIn{from{opacity:.2}}
.tile.opened{opacity:.55}
.combo{position:absolute;font-weight:900;font-size:22px;color:var(--accent3);pointer-events:none;transform:translate(-50%,-50%);animation:rise .8s forwards;z-index:4}
html[data-theme="bright"] .combo{color:#E08A00}
@keyframes rise{to{opacity:0;transform:translate(-50%,-180%)}}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,10,16,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.ov.on{display:flex}
.card{background:var(--surface);border-radius:26px;padding:28px;width:min(440px,100%);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.18);animation:zoom .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.card h3{margin:0 0 6px;font-size:30px;font-weight:900}
.card .sub{color:var(--muted);font-weight:700;margin-bottom:18px}
.card .score{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0}
.card .rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.card .rows div{background:var(--surface2);border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.card .rows b{display:block;font-size:20px}
.badge{display:inline-block;background:var(--accent3);color:#231B33;border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;margin-bottom:6px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{height:54px;border-radius:16px;font-weight:900;font-size:18px;background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--ink-on-accent);box-shadow:var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:none}
.namerow{display:flex;gap:8px;margin-top:6px}
.namerow input{flex:1;min-width:0;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700;font-size:17px;padding:0 14px}
.namerow .btn{height:50px;padding:0 18px}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;pointer-events:none}
.count.on{display:flex}
.count b{font-size:min(30vw,200px);font-weight:900;color:var(--accent);animation:zoom .3s}
.count span{font-weight:800;font-size:20px;background:var(--surface);padding:8px 18px;border-radius:999px;border:2px solid var(--line)}

/* records */
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td,th{padding:10px 12px;text-align:left;font-weight:700}
th{color:var(--muted);font-size:13px}
tbody tr td{background:var(--surface)}
tbody tr td:first-child{border-radius:12px 0 0 12px}
tbody tr td:last-child{border-radius:0 12px 12px 0}
.empty-note{color:var(--muted);font-weight:700;padding:24px;text-align:center}

@media (max-width:600px){
  .target .lab{display:none}
  .target .num{min-width:70px;font-size:26px;height:46px}
  .stat .t{font-size:20px}
  .hud .ibtn.opt{padding:0 10px;font-size:13px}
  .top .ibtn .tx{display:none}
  .top .ibtn{padding:0 8px}
  .logo .mark{width:44px;height:44px;font-size:18px}
  .logo small{display:none}
  .daily{padding:16px}
  .daily .cal{width:50px;height:50px;font-size:20px}
  .daily .go{display:none}
}
</style>
</head>

/* ===================== RNG ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ===================== sound (synthesized, offline) ===================== */
const Snd={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,d=.09,type='sine',vol=.18,when=0){if(!S.sound||!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+when;
    o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.02)},
  ok(step){const f=880*Math.pow(2,Math.min(step,24)/24);
    this.tone(f,.09,'triangle',.18);this.tone(f*1.5,.14,'sine',.1,.04);this.tone(f*2,.22,'sine',.07,.08)},
  bad(){this.tone(140,.18,'square',.08);this.tone(110,.2,'square',.06,.05)},
  call(){[660,990].forEach((f,i)=>this.tone(f,.16,'triangle',.18,i*.09))},
  tick(){this.tone(880,.05,'sine',.1)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.18,i*.1))},
  lose(){[392,330,262].forEach((f,i)=>this.tone(f,.25,'triangle',.15,i*.14))}
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}

/* ===================== game ===================== */
let G=null;
const CMD_ROUNDS=10,CMD_SHOW=2000;
const MEM_PREVIEW=5;            // memory: seconds to memorise
const MEM_PEEK_EVERY=[12,18];   // memory: open everything again every 12–18 s …
const MEM_PEEK_MS=2000;         // … for 2 s
function schedulePeek(){
  clearTimeout(G.peekT);
  const s=MEM_PEEK_EVERY[0]+Math.random()*(MEM_PEEK_EVERY[1]-MEM_PEEK_EVERY[0]);
  G.peekT=setTimeout(peek,s*1000);
}
function peek(){
  if(!G||!G.running||G.ended)return;
  if(G.paused){G.peekT=setTimeout(peek,1000);return}
  const els=[...board.querySelectorAll('.tile.masked')];
  els.forEach(el=>el.classList.remove('masked'));
  board.classList.add('peeking');Snd.tick();
  G.peekT=setTimeout(()=>{
    if(!G||G.ended)return;
    els.forEach(el=>{if(!el.classList.contains('found')&&!el.classList.contains('opened'))el.classList.add('masked')});
    board.classList.remove('peeking');
    schedulePeek();
  },MEM_PEEK_MS);
}
const board=$('#board');

function startGame(cfg){
  Snd.init();
  const seed=cfg.daily?+todayKey().replace(/-/g,''):(cfg.seed??Math.floor(Math.random()*1e9));
  const n=cfg.count;
  let seq=Array.from({length:n},(_,i)=>i+1);
  if(isCmd(cfg.mode))seq=shuffle(seq,mulberry32(seed^0x5bd1e995)).slice(0,Math.min(CMD_ROUNDS,n));
  if(cfg.mode==='reverse')seq.reverse();
  G={...cfg,seed,n,seq,idx:0,mistakes:0,hints:0,penalty:0,t0:0,pausedAt:0,pausedMs:0,running:false,paused:false,preview:false,
     combo:0,lastHit:0,ended:false,limitMs:cfg.mode==='attack'?60000:0,announcing:false,
     imgs:cfg.mode==='commandImg'?shuffle(IMAGES.slice(),mulberry32(seed^0x1234)).slice(0,n):null};
  $('#tLab').textContent=cfg.mode==='commandImg'?t('findImg'):t('find');
  $('#bHint').textContent=cfg.mode==='attack'?t('hintA'):t('hint');
  show('game');
  requestAnimationFrame(()=>{buildBoard();countdown()});
}

function buildBoard(){
  const rng=mulberry32(G.seed);
  const w=board.clientWidth,h=board.clientHeight;
  board.innerHTML='';board.classList.remove('hidden');
  const hard=G.diff==='hard',easy=G.diff==='easy';
  const pal=hard?(S.theme==='dark'?PAL.hardDark:PAL.hardBright):PAL[S.theme];
  const order=shuffle(Array.from({length:G.n},(_,i)=>i+1),rng); // color/size randomness per number
  if(G.mode==='grid'){
    const cols=Math.ceil(Math.sqrt(G.n)),rows=Math.ceil(G.n/cols);
    G.layout={grid:true,cols,rows};
    const wrapEl=document.createElement('div');wrapEl.className='gridwrap';
    wrapEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    const cells=shuffle(Array.from({length:cols*rows},(_,i)=>i<G.n?i+1:0),rng);
    cells.forEach(v=>{
      const el=document.createElement('button');
      if(!v){el.className='tile empty';wrapEl.appendChild(el);return}
      el.className='tile'+(G.imgs?' imgt':'');el.dataset.v=v;el.innerHTML=lab(v);
      el.style.color=pal[Math.floor(rng()*pal.length)];
      if(hard&&!G.imgs)el.classList.add('ul');
      wrapEl.appendChild(el);
    });
    board.appendChild(wrapEl);
  }else{
    const a=w/h;
    let cols=Math.max(1,Math.round(Math.sqrt(G.n*a))),rows=Math.max(1,Math.ceil(G.n/cols));
    const need=Math.ceil(G.n*1.18);
    while(cols*rows<need){if(cols/rows<a)cols++;else rows++}
    G.layout={grid:false,cols,rows};
    const cells=shuffle(Array.from({length:cols*rows},(_,i)=>i),rng).slice(0,G.n);
    const jit=easy?.25:.4;
    for(let v=1;v<=G.n;v++){
      const c=cells[v-1],cx=c%cols,cy=Math.floor(c/cols);
      const x=(cx+.5+(rng()-.5)*jit)/cols,y=(cy+.5+(rng()-.5)*jit)/rows;
      const el=document.createElement('button');
      el.className='tile'+(G.imgs?' imgt':'');el.dataset.v=v;el.innerHTML=lab(v);
      el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';
      const s=easy?1:hard?(.7+rng()*.55):(.82+rng()*.3);
      const rot=easy?0:hard?Math.round((rng()-.5)*300):Math.round((rng()-.5)*40);
      el.style.setProperty('--s',(G.n>=100?s*.85:s).toFixed(2));
      el.style.setProperty('--rot',(G.imgs?Math.round(rot/4):rot)+'deg');
      el.style.color=pal[(order[v-1]+Math.floor(rng()*3))%pal.length];
      if(hard&&!G.imgs)el.classList.add('ul');
      board.appendChild(el);
    }
  }
  sizeBoard();
}
function sizeBoard(){
  if(!G||!G.layout)return;
  const w=board.clientWidth,h=board.clientHeight,{cols,rows}=G.layout;
  if(G.layout.grid){
    // fill the whole board: cells stretch to the screen, text sized by the shorter side
    const gap=Math.max(4,Math.min(10,Math.min(w,h)/90));
    const cw=(w-gap*(cols-1))/cols,ch=(h-gap*(rows-1))/rows;
    const wr=board.querySelector('.gridwrap');
    wr.style.gridTemplateColumns=`repeat(${cols},1fr)`;wr.style.gridTemplateRows=`repeat(${rows},1fr)`;
    board.style.setProperty('--ggap',gap+'px');
    board.style.setProperty('--cell',Math.min(cw,ch)+'px');
  }else{
    board.style.setProperty('--cell',Math.min(w/cols,h/rows)+'px');
  }
}
window.addEventListener('resize',sizeBoard);

function countdown(){
  const box=$('#count'),num=$('#countNum'),msg=$('#countMsg');
  const memory=G.mode==='memory';
  msg.textContent=memory?t('remember'):t('ready');
  box.classList.add('on');
  if(!memory)board.classList.add('hidden');
  G.preview=true;updateHUD();
  let k=memory?MEM_PREVIEW:3;num.textContent=fmt(k,9).replace(/^[0๐]/,'');Snd.tick();
  const step=()=>{
    if(!G||G.ended)return;
    k--;
    if(k>0){num.textContent=fmt(k,9).replace(/^[0๐]/,'');num.style.animation='none';num.offsetWidth;num.style.animation='';Snd.tick();G.cd=setTimeout(step,memory?1000:800);return}
    box.classList.remove('on');board.classList.remove('hidden');
    if(memory)board.querySelectorAll('.tile:not(.empty)').forEach(el=>el.classList.add('masked'));
    G.preview=false;G.running=true;G.t0=performance.now();
    loop();
    if(isCmd(G.mode))announce();
    if(memory)schedulePeek();
  };
  G.cd=setTimeout(step,memory?1000:800);
}

function elapsed(){
  if(!G.t0)return 0;
  const now=G.paused?G.pausedAt:G.announcing?G.annStart:performance.now();
  return now-G.t0-G.pausedMs+G.penalty;
}
/* command mode: call the number big in the middle, then fly it to the HUD.
   The call time is not counted (clock frozen while announcing). */
function announce(){
  const tgt=G.seq[G.idx];if(tgt==null)return;
  const c=$('#callout'),hud=$('#tNum');
  G.announcing=true;G.annStart=performance.now();
  board.classList.add('dim');
  hud.textContent='—';
  c.innerHTML=lab(tgt);c.classList.toggle('im',!!G.imgs);c.style.transform='';c.style.opacity='';
  c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
  Snd.call();
  G.annT=setTimeout(()=>{
    if(!G||G.ended)return;
    const a=c.getBoundingClientRect(),b=hud.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2),sc=b.height/a.height;
    const anim=c.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${sc})`}],{duration:320,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
    anim.onfinish=()=>{
      if(!G||G.ended)return;
      c.classList.remove('on');anim.cancel();
      board.classList.remove('dim');
      G.pausedMs+=performance.now()-G.annStart;G.announcing=false;
      updateHUD();hud.classList.add('pop');setTimeout(()=>hud.classList.remove('pop'),120);
    };
  },CMD_SHOW);
}
function loop(){
  if(!G||!G.running)return;
  updateTime();
  G.raf=requestAnimationFrame(loop);
}
function updateTime(){
  const e=elapsed(),el=$('#sTime');
  if(G.limitMs){const left=G.limitMs-e;el.textContent=fmtTime(left);el.classList.toggle('warn',left<10000);if(left<=0)finish('timeup')}
  else{el.textContent=fmtTime(e);el.classList.remove('warn')}
}
function updateHUD(){
  const tgt=G.seq[G.idx];
  $('#tNum').classList.toggle('im',!!G.imgs);
  $('#tNum').innerHTML=(tgt==null||(isCmd(G.mode)&&(G.preview||G.announcing)))?'—':lab(tgt);
  $('#pBar').style.width=(G.idx/G.seq.length*100)+'%';
  const m=$('#sMis');
  if(G.mis){m.innerHTML=Array.from({length:G.mis},(_,i)=>`<i class="${i<G.mistakes?'x':''}"></i>`).join('')}
  else m.innerHTML=G.mistakes?`<em>${t('mistakes')} ${G.mistakes}</em>`:'';
  if(!G.running&&!G.preview){$('#sTime').textContent=G.limitMs?fmtTime(G.limitMs):'0.00'}
  if(G.preview)$('#sTime').textContent=G.limitMs?fmtTime(G.limitMs):'0.00';
}

board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.tile');
  if(!el||el.classList.contains('empty')||!G||!G.running||G.paused||G.announcing)return;
  e.preventDefault();
  const v=+el.dataset.v,target=G.seq[G.idx];
  if(el.classList.contains('found'))return;
  if(v===target){
    el.classList.remove('masked','hint');el.classList.add('found');
    G.idx++;
    const now=performance.now();
    G.combo=(now-G.lastHit<1300)?G.combo+1:1;G.lastHit=now;
    Snd.ok(G.idx%25);
    sparkle(el);
    if(G.combo>=3)showCombo(e.clientX,e.clientY,G.combo);
    const n=$('#tNum');n.classList.add('pop');setTimeout(()=>n.classList.remove('pop'),120);
    updateHUD();
    if(G.idx>=G.seq.length)finish('clear');
    else if(isCmd(G.mode))setTimeout(()=>{if(G&&!G.ended)announce()},250);
  }else{
    G.mistakes++;G.combo=0;Snd.bad();
    el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');
    if(G.mode==='memory'){el.classList.remove('masked');el.classList.add('opened')} // wrong pick stays open
    if(G.limitMs)G.penalty+=2000;
    updateHUD();
    if(G.mis&&G.mistakes>=G.mis&&!G.limitMs)finish('fail');
  }
});
function sparkle(el){
  const r=board.getBoundingClientRect(),b=el.getBoundingClientRect();
  const cx=b.left+b.width/2-r.left,cy=b.top+b.height/2-r.top;
  const a=document.createElement('div');a.className='star';a.style.left=(cx+b.width*.32)+'px';a.style.top=(cy-b.height*.3)+'px';
  const s=document.createElement('div');s.className='star s2';s.style.left=(cx-b.width*.38)+'px';s.style.top=(cy+b.height*.25)+'px';
  board.append(a,s);setTimeout(()=>{a.remove();s.remove()},650);
}
function showCombo(x,y,c){
  const r=board.getBoundingClientRect();
  const s=document.createElement('div');s.className='combo';s.textContent='x'+c;
  s.style.left=(x-r.left)+'px';s.style.top=(y-r.top)+'px';
  board.appendChild(s);setTimeout(()=>s.remove(),800);
}
$('#bHint').onclick=()=>{
  if(!G||!G.running||G.paused)return;
  if(G.announcing)return;
  const tgt=G.seq[G.idx];const el=board.querySelector(`.tile[data-v="${tgt}"]`);if(!el)return;
  el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint');
  if(G.mode==='memory'){el.classList.remove('masked');setTimeout(()=>{if(!el.classList.contains('found')&&!el.classList.contains('opened'))el.classList.add('masked')},1200)}
  G.hints++;G.penalty+=3000;Snd.tick();
};

/* pause */
function pause(){
  if(!G||!G.running||G.paused||G.announcing)return;
  G.paused=true;G.pausedAt=performance.now();board.classList.add('hidden');
  $('#pTitle').textContent=t('paused');$('#pSub').textContent=t('pausedSub');
  $('#pResume').textContent=t('resume');$('#pRestart').textContent=t('restart');$('#pHome').textContent=t('home');
  $('#ovPause').classList.add('on');
}
function resume(){
  if(!G||!G.paused)return;
  G.pausedMs+=performance.now()-G.pausedAt;G.paused=false;board.classList.remove('hidden');
  $('#ovPause').classList.remove('on');
}
function stopGame(){if(!G)return;G.running=false;G.ended=true;clearTimeout(G.cd);clearTimeout(G.peekT);board.classList.remove('peeking');clearTimeout(G.annT);cancelAnimationFrame(G.raf);$('#callout').classList.remove('on');board.classList.remove('dim')}
$('#bPause').onclick=()=>{if(G&&(G.preview||G.announcing))return;pause()};
$('#pResume').onclick=resume;
$('#pRestart').onclick=()=>{$('#ovPause').classList.remove('on');const c=G;stopGame();startGame({mode:c.mode,count:c.count,diff:c.diff,mis:c.mis,daily:c.daily})};
$('#pHome').onclick=()=>{$('#ovPause').classList.remove('on');stopGame();G=null;renderHome();show('home')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(G&&G.paused)resume();else pause()}
  if(e.key==='f'||e.key==='F')toggleFs();
});

/* finish */
function finish(kind){
  if(!G||G.ended)return;
  const ms=G.limitMs?G.limitMs:elapsed();
  stopGame();
  if(G.limitMs){$('#sTime').textContent=fmtTime(Math.max(0,G.limitMs-elapsed()))}else{$('#sTime').textContent=fmtTime(ms)}
  board.querySelectorAll('.tile.masked').forEach(el=>el.classList.remove('masked'));
  const win=kind==='clear'||kind==='timeup'&&G.idx>0;
  (kind==='clear'||kind==='timeup')?Snd.win():Snd.lose();
  let score=null,rank=0,isBest=false;
  if(kind==='clear'&&isTimeMode(G.mode))score=ms;
  if(G.mode==='attack')score=G.idx;
  if(G.daily&&kind==='clear'){
    const d=store.get('daily',{}),k=todayKey();
    if(d[k]==null||ms<d[k]){d[k]=Math.round(ms);store.set('daily',d);isBest=true}
  }else if(score!=null&&(G.mode!=='attack'||score>0)){
    const recs=getRecs(G.mode,G.count);
    const better=(a,b)=>isTimeMode(G.mode)?a<b:a>b;
    rank=recs.filter(r=>better(r.score,score)||r.score===score).length+1;
    if(rank>10)rank=0;
    isBest=rank===1;
  }
  G.result={kind,ms,score,rank,isBest};
  setTimeout(()=>showResult(),kind==='clear'?450:250);
}
function showResult(){
  const R=G.result,c=$('#resCard');
  const title=R.kind==='clear'?t('clear'):R.kind==='timeup'?t('timeup'):t('fail');
  const big=G.mode==='attack'?`${R.score} <small style="font-size:22px">/ ${G.n}</small>`:(R.kind==='clear'?fmtTime(R.ms)+'<small style="font-size:22px"> '+t('sec')+'</small>':`${G.idx} <small style="font-size:22px">/ ${G.seq.length}</small>`);
  const sub=(G.daily?t('daily'):t('m_'+G.mode))+' · '+t('sumCount',{n:G.n})+' · '+t(G.diff);
  const last=store.get('lastName','');
  c.innerHTML=`
    ${R.isBest?`<div class="badge">${t('newBest')}</div>`:R.rank?`<div class="badge">${t('rank',{n:R.rank})}</div>`:''}
    <h3>${title}</h3><div class="sub">${sub}</div>
    <div class="score">${big}</div>
    <div class="rows">
      <div>${G.mode==='attack'?t('time'):t('found')}<b>${G.mode==='attack'?'60 '+t('sec'):G.idx+' / '+G.seq.length}</b></div>
      <div>${t('mistakes')}<b>${G.mistakes}</b></div>
      <div>${t('hints')}<b>${G.hints}</b></div>
      <div>${t('best')}<b id="rBest"></b></div>
    </div>
    ${R.rank&&!G.daily?`<div class="namerow"><input id="inName" maxlength="16" placeholder="${t('name')}" value="${esc(last)}"><button class="btn pri" id="bSave">${t('save')}</button></div>`:''}
    <div class="btns"><button class="btn pri" id="bAgain">${t('again')}</button><button class="btn" id="bHome">${t('home')}</button></div>`;
  const setBest=()=>{
    let b='—';
    if(G.daily){const d=store.get('daily',{})[todayKey()];if(d!=null)b=fmtTime(d)+' '+t('sec')}
    else{const r=getRecs(G.mode,G.count);if(r.length)b=isTimeMode(G.mode)?fmtTime(r[0].score)+' '+t('sec'):String(r[0].score)}
    $('#rBest').textContent=b;
  };
  setBest();
  const sv=$('#bSave');
  if(sv)sv.onclick=()=>{
    const name=($('#inName').value||'Player').trim().slice(0,16)||'Player';
    store.set('lastName',name);
    const recs=getRecs(G.mode,G.count);
    recs.push({name,score:isTimeMode(G.mode)?Math.round(R.score):R.score,diff:G.diff,date:todayKey()});
    recs.sort((a,b)=>isTimeMode(G.mode)?a.score-b.score:b.score-a.score);
    store.set('rec.'+recKey(G.mode,G.count),recs.slice(0,10));
    sv.textContent=t('saved');sv.disabled=true;$('#inName').disabled=true;setBest();
  };
  $('#bAgain').onclick=()=>{$('#ovResult').classList.remove('on');const c2=G;startGame({mode:c2.mode,count:c2.count,diff:c2.diff,mis:c2.mis,daily:c2.daily})};
  $('#bHome').onclick=()=>{$('#ovResult').classList.remove('on');G=null;renderHome();show('home')};
  $('#ovResult').classList.add('on');
  const inp=$('#inName');if(inp&&!last)setTimeout(()=>inp.focus(),300);
}

/* init */
applyTheme();renderHome();
document.addEventListener('pointerdown',()=>Snd.init(),{once:true});
</script>
</body>
</html>
