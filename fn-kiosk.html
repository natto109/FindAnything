<!DOCTYPE html>
<html lang="en" data-theme="bright">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Find Number — Kiosk</title>
<style>
:root{--font:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif}
html[data-theme="bright"]{--bg:#FFF6E9;--surface:#FFFFFF;--surface2:#FFEFD6;--line:rgba(40,30,60,.12);--text:#231B33;--muted:#6E6680;--accent:#FF4D6D;--accent2:#3A86FF;--accent3:#F5B700;--ok:#1FAA6B;--bad:#E5383B;--ink:#FFFFFF;--shadow:0 6px 0 rgba(35,27,51,.12)}
html[data-theme="dark"]{--bg:#121419;--surface:#1C1F27;--surface2:#262A35;--line:rgba(255,255,255,.10);--text:#F3F2F7;--muted:#9BA1B0;--accent:#FF5C8A;--accent2:#4CC9F0;--accent3:#FFD23F;--ok:#3DDC97;--bad:#FF5A5F;--ink:#121419;--shadow:0 6px 0 rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center}
.mark{width:120px;height:120px;border-radius:34px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:50px;box-shadow:var(--shadow)}
.logo img{display:block;object-fit:contain;max-width:70vw}
.logo.s img{height:90px}.logo.m img{height:140px}.logo.l img{height:200px}
.logo.small .mark{width:56px;height:56px;border-radius:16px;font-size:23px}
.logo.small img{height:56px!important;max-width:220px}
.big{font-size:clamp(44px,8vw,110px);font-weight:900;letter-spacing:.02em;line-height:1;margin:22px 0 10px}
.muted{color:var(--muted);font-weight:700}
.btn{height:64px;padding:0 34px;border-radius:20px;border:3px solid var(--line);background:var(--surface);font-weight:900;font-size:22px;letter-spacing:.03em;box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--ink);border-color:transparent}
.btn.sm{height:50px;font-size:17px;padding:0 22px;border-radius:16px}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{opacity:.4}

/* landing */
#landing{overflow:hidden}
#landing .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.tap{margin-top:30px;font-size:clamp(22px,3vw,34px);font-weight:900;color:var(--accent);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.floaters{position:absolute;inset:0;z-index:1;pointer-events:none}
.fb{position:absolute;bottom:-200px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:floatUp var(--dur,8s) linear forwards}
.fb .ph{width:var(--sz,120px);height:var(--sz,120px);border-radius:50%;background:var(--surface);border:5px solid var(--accent3);overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:calc(var(--sz,120px) * .4);color:var(--muted);box-shadow:var(--shadow);position:relative}
.fb .ph img{width:100%;height:100%;object-fit:cover}
.fb .rk{position:absolute;top:-6px;left:-6px;width:42px;height:42px;border-radius:50%;background:var(--accent3);color:#231B33;font-weight:900;font-size:20px;display:grid;place-items:center}
.fb .nm{background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;box-shadow:var(--shadow);white-space:nowrap}
.fb .nm small{color:var(--muted);font-weight:800;margin-left:6px}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1;transform:translateY(-18vh) scale(1)}80%{opacity:1}100%{transform:translateY(-120vh) scale(1);opacity:0}}
.lb-corner{position:absolute;right:28px;bottom:28px;z-index:3}

/* menu */
#menu .content{width:min(1100px,94vw);display:flex;flex-direction:column;align-items:center}
#menu .modes{width:100%}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin:30px 0}
.mode{background:var(--surface);border:3px solid var(--line);border-radius:30px;padding:30px 26px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:260px}
.mode:active{transform:translateY(5px);box-shadow:none}
.mode .mono{align-self:flex-start;min-width:64px;height:64px;padding:0 12px;border-radius:18px;border:4px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:24px}
.mode b{font-size:28px;font-weight:900}
.mode span.d{color:var(--muted);font-weight:700;font-size:17px;line-height:1.35}
.mode .best{margin-top:auto;font-weight:900;color:var(--accent2);font-size:16px}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

/* game */
.hud{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:3px solid var(--line);position:relative;z-index:3}
.target{display:flex;align-items:center;gap:14px;margin:0 auto}
.target .lab{font-weight:900;color:var(--muted);font-size:18px;letter-spacing:.06em}
.num{min-width:100px;height:64px;padding:0 18px;border-radius:18px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:38px;font-weight:900;transition:transform .12s}
.num.im{background:var(--surface);border:3px solid var(--accent)}
.num img{width:50px;height:50px;object-fit:contain;display:block}
.num.pop{transform:scale(1.15)}
.stat{min-width:120px;text-align:right}
.stat .t{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .p{font-weight:800;color:var(--muted);font-size:15px}
.prog{height:6px;background:var(--surface2)}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#game.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-16px,4px)}30%{transform:translate(14px,-4px)}45%{transform:translate(-10px,3px)}60%{transform:translate(8px,-2px)}75%{transform:translate(-4px,1px)}}
#game.shake .hud{background:var(--bad)}
.board{flex:1;position:relative;overflow:hidden;margin:10px}
.board.hidden .tile{visibility:hidden}
.board.lock .tile{opacity:.45}
.tile{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));border:0;background:none;font-size:calc(var(--cell) * .46 * var(--s,1));font-weight:900;line-height:1;padding:.18em .26em;border-radius:.3em;font-variant-numeric:tabular-nums;touch-action:manipulation}
.tile.ul span{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
.tile.imgt{padding:.06em}
.tile img{display:block;width:calc(var(--cell) * .74 * var(--s,1));height:calc(var(--cell) * .74 * var(--s,1));object-fit:contain;pointer-events:none}
.tile.found{pointer-events:none;animation:out .32s ease-out forwards}
@keyframes out{to{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.2);opacity:0}}
.tile.wrong{animation:wr .4s}
@keyframes wr{0%,100%{translate:0}25%{translate:-7px}50%{translate:7px}}
.dim .tile{opacity:.18}
.star{position:absolute;width:calc(var(--cell) * .55);height:calc(var(--cell) * .55);background:var(--accent3);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);pointer-events:none;z-index:4;transform:translate(-50%,-50%) scale(0);animation:ping .5s ease-out forwards}
.star.s2{width:calc(var(--cell) * .26);height:calc(var(--cell) * .26);animation-delay:.07s;background:var(--accent2)}
@keyframes ping{40%{transform:translate(-50%,-50%) scale(1.15) rotate(30deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.2) rotate(70deg);opacity:0}}
.callout{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;pointer-events:none;min-width:1.5em;padding:.08em .3em;border-radius:.18em;background:var(--accent);color:var(--ink);font-size:min(30vw,40vh);font-weight:900;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 .06em 0 rgba(0,0,0,.18)}
.callout.im{background:var(--surface);border:4px solid var(--accent)}
.callout img{width:1.4em;height:1.4em;object-fit:contain;display:block;margin:.05em}
.callout.on{display:block;animation:cin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes cin{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:7;pointer-events:none}
.count.on{display:flex}
.count b{font-size:min(36vw,320px);font-weight:900;color:var(--accent);animation:zoom .3s}
@keyframes zoom{from{transform:scale(.5);opacity:0}}

/* result / photo / name */
.card{background:var(--surface);border-radius:34px;padding:36px 44px;box-shadow:0 10px 0 rgba(0,0,0,.15);text-align:center;min-width:min(560px,92vw);animation:zoom .3s cubic-bezier(.2,1.4,.4,1)}
.card h2{margin:0;font-size:46px;font-weight:900}
.score{font-size:clamp(70px,11vw,130px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;margin:10px 0}
.score small{font-size:.35em;color:var(--muted)}
.badge{display:inline-block;background:var(--accent3);color:#231B33;border-radius:999px;padding:8px 20px;font-weight:900;font-size:20px;margin-bottom:10px}
.cam{position:relative;width:min(56vh,80vw);height:min(56vh,80vw);border-radius:50%;overflow:hidden;background:#000;border:8px solid var(--accent3);margin:10px auto 22px}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam.mirror video{transform:scaleX(-1)}
.cam .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;font-weight:900;color:#fff}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.namebox{font-size:48px;font-weight:900;min-height:84px;border-bottom:5px solid var(--accent);padding:6px 20px;margin:4px auto 20px;min-width:min(560px,80vw);letter-spacing:.06em}
.namebox .cur{display:inline-block;width:4px;height:48px;background:var(--accent);vertical-align:middle;animation:blinkc 1s steps(2,jump-none) infinite}
@keyframes blinkc{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:10px;align-items:center}
.kb .r{display:flex;gap:10px}
.kb button{width:min(7.4vw,76px);height:min(7.4vw,76px);border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:min(3vw,30px);font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.kb button:active{transform:translateY(3px);box-shadow:none;background:var(--surface2)}
.kb button.w{width:min(22vw,230px);font-size:20px}
.kb button.ok{background:var(--accent);color:var(--ink);border-color:transparent}

/* leaderboard */
#lb .content{width:min(1100px,94vw);height:100%;display:flex;flex-direction:column;padding:26px 0}
.tabs{display:flex;gap:10px;justify-content:center;margin:18px 0}
.tabs button{height:54px;padding:0 24px;border-radius:999px;border:3px solid var(--line);background:var(--surface);font-weight:900;font-size:18px}
.tabs button.on{background:var(--accent);color:var(--ink);border-color:transparent}
.list{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.li{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:22px;padding:12px 18px;box-shadow:var(--shadow);border:3px solid transparent}
.li.me{border-color:var(--accent3);animation:zoom .5s}
.li .r{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:21px;flex:none}
.li:nth-child(1) .r{background:var(--accent3);color:#231B33}
.li:nth-child(2) .r,.li:nth-child(3) .r{background:var(--accent2);color:#fff}
.li .ph{width:66px;height:66px;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--muted);flex:none}
.li .ph img{width:100%;height:100%;object-fit:cover}
.li .n{text-align:left;flex:1;min-width:0;font-weight:900;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.li .t{font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-weight:800;font-size:22px;padding:60px}

/* hidden corners + settings */
.corner{position:fixed;top:0;width:90px;height:90px;z-index:50}
.corner.l{left:0}.corner.r{right:0}
.modal{position:fixed;inset:0;background:rgba(10,10,16,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.panel{background:var(--surface);border-radius:28px;width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column;animation:zoom .25s}
.panel header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:3px solid var(--line)}
.panel header h3{margin:0;font-size:26px;font-weight:900;flex:1}
.panel .body{overflow-y:auto;padding:4px 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.group{margin-top:18px}.group.full{grid-column:1/-1}
.group .lbl{font-weight:900;font-size:13px;margin-bottom:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:11px 16px;border-radius:13px;border:2px solid transparent;background:var(--surface2);font-weight:800;font-size:16px}
.seg button.on{background:var(--accent);color:var(--ink)}
.seg button.danger{color:var(--bad)}
.note{font-size:13px;color:var(--muted);font-weight:600;margin-top:7px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:14px 22px;border-radius:16px;font-weight:800;z-index:70}
.quit{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>

<!-- LANDING (idle screen) -->
<section class="screen center on" id="landing">
  <div class="floaters" id="floaters"></div>
  <div class="content">
    <div class="logo" id="logoL"></div>
    <div class="big">FIND NUMBER</div>
    <div class="muted" style="font-size:22px">How fast can you find them all?</div>
    <div class="tap">TAP ANYWHERE TO PLAY</div>
  </div>
  <button class="btn sm lb-corner" id="lbFromLanding">LEADERBOARD</button>
</section>

<!-- MENU -->
<section class="screen center" id="menu">
  <div class="content">
    <div class="logo small" id="logoM"></div>
    <div class="big" style="font-size:clamp(34px,5vw,64px);margin-top:16px">CHOOSE A GAME</div>
    <div class="modes" id="modes"></div>
    <div class="row"><button class="btn" id="bLb">LEADERBOARD</button><button class="btn" id="bHome1">HOME</button></div>
  </div>
</section>

<!-- GAME -->
<section class="screen" id="game">
  <div class="hud">
    <button class="btn sm" id="bQuit">QUIT</button>
    <div class="target"><span class="lab">FIND</span><div class="num" id="tNum">—</div></div>
    <div class="stat"><div class="t" id="sTime">0.00</div><div class="p" id="sProg"></div></div>
  </div>
  <div class="prog"><i id="pBar"></i></div>
  <div class="board" id="board"></div>
</section>
<div class="callout" id="callout"></div>
<div class="count" id="count"><b id="countNum">3</b></div>

<!-- RESULT -->
<section class="screen center" id="result"><div class="card" id="resCard"></div></section>

<!-- PHOTO -->
<section class="screen center" id="photo">
  <div class="big" style="font-size:clamp(30px,4.5vw,56px);margin:0 0 6px">SMILE!</div>
  <div class="muted" style="font-size:20px">Your photo goes on the leaderboard</div>
  <div class="cam" id="cam"><video id="video" autoplay playsinline muted></video><div class="cdn" id="camCd"></div><div class="flash" id="flash"></div></div>
  <div class="row" id="camBtns"></div>
</section>

<!-- NAME -->
<section class="screen center" id="name">
  <div class="big" style="font-size:clamp(30px,4.5vw,56px);margin:0 0 10px">YOUR NAME</div>
  <div class="namebox" id="nameBox"></div>
  <div class="kb" id="kb"></div>
</section>

<!-- LEADERBOARD -->
<section class="screen center" id="lb">
  <div class="content">
    <div class="big" style="font-size:clamp(34px,5vw,64px);margin:0">LEADERBOARD</div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="row" style="margin-top:18px"><button class="btn pri" id="lbPlay">PLAY</button><button class="btn" id="bHome2">HOME</button></div>
  </div>
</section>

<div class="corner l" id="cornerL"></div>
<div class="corner r" id="cornerR"></div>
<div class="modal" id="settings"><div class="panel"><header><h3>Kiosk settings</h3><button class="btn sm pri" id="sDone">DONE</button></header><div class="body" id="sBody"></div></div></div>
<input type="file" id="logoFile" accept="image/*" style="display:none">

<script src="img/images.js" onerror="window.FN_IMAGES=window.FN_IMAGES||[]"></script>
<script>
/* =====================================================================
   Find Number — Kiosk (single player, offline)
   Hidden controls: tap the TOP-RIGHT corner 3 times = settings
                    tap the TOP-LEFT  corner 3 times = exit
   Scores + photos are kept on this device (IndexedDB).
   ===================================================================== */
const $=s=>document.querySelector(s);
const IMAGES=(window.FN_IMAGES||[]).slice();
const ls={get(k,d){try{const v=localStorage.getItem('fnk.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fnk.'+k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({photo:'top',count:36,diff:'normal',rounds:5,idle:60,theme:'bright',sound:true,mirror:true,logo:null,logoSize:'m'},ls.get('settings',{}));
function saveS(){ls.set('settings',S);applyS()}
function applyS(){document.documentElement.dataset.theme=S.theme;renderLogos()}

const MODES=[
  {id:'timed',mono:'1→',name:'Count Up',desc:'Tap 1, 2, 3… in order as fast as you can.'},
  {id:'called',mono:'?',name:'Called Numbers',desc:'A number pops up — find it. Rounds against the clock.'},
  {id:'pictures',mono:'IMG',name:'Called Pictures',desc:'A picture pops up — find it. Rounds against the clock.'}
];
const modeName=id=>MODES.find(m=>m.id===id).name;

/* ---------- storage (IndexedDB: scores with photos) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('fnkiosk',1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('scores',{keyPath:'id',autoIncrement:true});s.createIndex('mode','mode')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  add(rec){return new Promise(res=>{const tx=this.db.transaction('scores','readwrite');const q=tx.objectStore('scores').add(rec);q.onsuccess=()=>res(q.result)})},
  all(mode){return new Promise(res=>{const tx=this.db.transaction('scores');const q=tx.objectStore('scores').index('mode').getAll(mode);q.onsuccess=()=>res(q.result||[])})},
  clear(){return new Promise(res=>{const tx=this.db.transaction('scores','readwrite');tx.objectStore('scores').clear();tx.oncomplete=res})}
};
async function top10(mode){return (await DB.all(mode)).sort((a,b)=>a.ms-b.ms||a.at-b.at).slice(0,10)}
async function rankOf(mode,ms){const all=(await DB.all(mode)).sort((a,b)=>a.ms-b.ms);return all.filter(r=>r.ms<=ms).length+1}

/* ---------- sound ---------- */
const Snd={ctx:null,init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,d,type,vol,when=0){if(!S.sound||!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.02)},
  ok(i){const f=880*Math.pow(2,Math.min(i%25,24)/24);this.tone(f,.09,'triangle',.18);this.tone(f*1.5,.14,'sine',.1,.04);this.tone(f*2,.22,'sine',.07,.08)},
  bad(){this.tone(220,.12,'sawtooth',.16);this.tone(150,.28,'sawtooth',.16,.1)},
  tick(){this.tone(880,.07,'sine',.15)},call(){[660,990].forEach((f,i)=>this.tone(f,.16,'triangle',.18,i*.09))},
  shutter(){this.tone(1800,.04,'square',.12);this.tone(900,.08,'square',.08,.05)},key(){this.tone(1200,.03,'sine',.08)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.18,i*.1))}};
document.addEventListener('pointerdown',()=>Snd.init(),true);

/* ---------- navigation + idle ---------- */
let current='landing',lastTouch=Date.now();
function show(id){current=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));lastTouch=Date.now();
  if(id==='landing')startFloaters();else stopFloaters();
  if(id!=='photo')stopCam();}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now()},true));
setInterval(()=>{
  if(current==='landing'||$('#settings').classList.contains('on'))return;
  const limit=S.idle*1000*(current==='game'?1.5:1);
  if(Date.now()-lastTouch>limit){if(G)stopGame();goLanding()}
},1000);
function goLanding(){$('#callout').classList.remove('on');$('#count').classList.remove('on');show('landing')}

$('#landing').addEventListener('click',e=>{if(e.target.closest('#lbFromLanding'))return;openMenu()});
$('#lbFromLanding').onclick=e=>{e.stopPropagation();openLb()};
$('#bLb').onclick=()=>openLb();
$('#bHome1').onclick=goLanding;$('#bHome2').onclick=goLanding;
$('#lbPlay').onclick=openMenu;

/* ---------- logo ---------- */
function renderLogos(){
  const html=S.logo?`<img src="${S.logo}" alt="">`:'<div class="mark">FN</div>';
  $('#logoL').className='logo '+(S.logo?S.logoSize:'');$('#logoL').innerHTML=html;
  $('#logoM').className='logo small';$('#logoM').innerHTML=html;
}
$('#logoFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const img=new Image();img.onload=()=>{const sc=Math.min(1,600/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S.logo=cv.toDataURL('image/png');saveS();renderSettings()};img.src=URL.createObjectURL(f)};

/* ---------- menu ---------- */
async function openMenu(){
  show('menu');
  const bests=await Promise.all(MODES.map(m=>top10(m.id)));
  $('#modes').innerHTML=MODES.map((m,i)=>{const b=bests[i][0];const off=m.id==='pictures'&&IMAGES.length<4;
    return `<button class="mode" data-m="${m.id}" ${off?'style="opacity:.45"':''}><span class="mono">${m.mono}</span><b>${m.name}</b><span class="d">${off?'Add pictures to the img folder to play this mode.':m.desc}</span><span class="best">${b?'BEST '+fmtT(b.ms)+' · '+esc(b.name):'No record yet — be the first!'}</span></button>`}).join('');
  $('#modes').querySelectorAll('.mode').forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m==='pictures'&&IMAGES.length<4){toast('No pictures found in the img folder');return}startGame(m)});
}

/* ---------- game ---------- */
const PAL={bright:['#FF4D6D','#FF7A1A','#E0A100','#1FAA6B','#00A3C7','#3A86FF','#7B4DFF','#D63CA0'],dark:['#FF5C8A','#FF9F43','#FFD23F','#3DDC97','#4CC9F0','#6C9BFF','#B388FF','#FF77C8'],
  hardBright:['#3A86FF','#3F7FF0','#4A8CFF','#3576E8','#5B8FF5'],hardDark:['#4CC9F0','#55C2EE','#45BFE8','#5ACFF5','#4DB8E0']};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function fmtT(ms){return (Math.max(0,ms)/1000).toFixed(2)+'s'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CALL_MS=2000,WRONG_LOCK=600;
let G=null;const board=$('#board');

function lab(v){if(G.imgs)return `<img src="img/${encodeURIComponent(G.imgs[v-1])}" alt="">`;return `<span>${String(v).padStart(Math.max(2,String(G.n).length),'0')}</span>`}
function startGame(mode){
  const seed=Math.floor(Math.random()*2e9),r=rng(seed);
  const n=mode==='pictures'?Math.min(S.count,IMAGES.length):S.count;
  let seq=Array.from({length:n},(_,i)=>i+1);
  if(mode!=='timed')seq=shuffle(seq.slice(),rng(seed^0x5bd1e995)).slice(0,Math.min(S.rounds,n));
  G={mode,seed,n,seq,idx:0,mis:0,lock:0,t0:0,running:false,announcing:false,annMs:0,ended:false,
     imgs:mode==='pictures'?shuffle(IMAGES.slice(),rng(seed^0x1234)).slice(0,n):null};
  show('game');
  requestAnimationFrame(()=>{build(r);hud();countdown()});
}
function build(r){
  board.innerHTML='';
  const w=board.clientWidth,h=board.clientHeight,a=w/h,n=G.n;
  const hard=S.diff==='hard',easy=S.diff==='easy';
  const pal=hard?(S.theme==='dark'?PAL.hardDark:PAL.hardBright):PAL[S.theme];
  let cols=Math.max(1,Math.round(Math.sqrt(n*a))),rows=Math.max(1,Math.ceil(n/cols));
  const need=Math.ceil(n*1.18);while(cols*rows<need){if(cols/rows<a)cols++;else rows++}
  G.cols=cols;G.rows=rows;
  const cells=shuffle(Array.from({length:cols*rows},(_,i)=>i),r).slice(0,n);
  const jit=easy?.25:.4;
  for(let v=1;v<=n;v++){
    const c=cells[v-1],cx=c%cols,cy=Math.floor(c/cols);
    const el=document.createElement('button');
    el.className='tile'+(G.imgs?' imgt':'')+(hard&&!G.imgs?' ul':'');el.dataset.v=v;el.innerHTML=lab(v);
    el.style.left=((cx+.5+(r()-.5)*jit)/cols*100)+'%';el.style.top=((cy+.5+(r()-.5)*jit)/rows*100)+'%';
    const s=easy?1:hard?(.7+r()*.55):(.82+r()*.3);const rot=easy?0:hard?Math.round((r()-.5)*300):Math.round((r()-.5)*40);
    el.style.setProperty('--s',s.toFixed(2));el.style.setProperty('--rot',(G.imgs?Math.round(rot/4):rot)+'deg');
    el.style.color=pal[Math.floor(r()*pal.length)];
    board.appendChild(el);
  }
  size();
}
function size(){if(!G||!G.cols)return;board.style.setProperty('--cell',Math.min(board.clientWidth/G.cols,board.clientHeight/G.rows)+'px')}
window.addEventListener('resize',size);
function countdown(){
  board.classList.add('hidden');const box=$('#count'),num=$('#countNum');box.classList.add('on');
  let k=3;num.textContent=k;Snd.tick();
  const step=()=>{if(!G||G.ended)return;k--;
    if(k>0){num.textContent=k;num.style.animation='none';void num.offsetWidth;num.style.animation='';Snd.tick();G.cd=setTimeout(step,800);return}
    box.classList.remove('on');board.classList.remove('hidden');G.running=true;G.t0=performance.now();loop();
    if(G.mode!=='timed')announce();};
  G.cd=setTimeout(step,800);
}
function elapsed(){if(!G.t0)return 0;return (G.announcing?G.annStart:performance.now())-G.t0-G.annMs}
function loop(){if(!G||!G.running)return;$('#sTime').textContent=(elapsed()/1000).toFixed(2);G.raf=requestAnimationFrame(loop)}
function hud(){
  const t=G.seq[G.idx];const n=$('#tNum');n.classList.toggle('im',!!G.imgs);
  n.innerHTML=(t==null||(G.mode!=='timed'&&(G.announcing||!G.running)))?'—':lab(t);
  $('#sProg').textContent=G.mode==='timed'?`${G.idx} / ${G.seq.length}`:`Round ${Math.min(G.idx+1,G.seq.length)} / ${G.seq.length}`;
  $('#pBar').style.width=(G.idx/G.seq.length*100)+'%';
}
/* called modes: show the target big in the middle for 2 s, then fly it to the top. The call time is not counted. */
function announce(){
  const t=G.seq[G.idx];if(t==null)return;const c=$('#callout'),h=$('#tNum');
  G.announcing=true;G.annStart=performance.now();board.classList.add('dim');hud();
  c.innerHTML=lab(t);c.classList.toggle('im',!!G.imgs);c.classList.remove('on');void c.offsetWidth;c.classList.add('on');Snd.call();
  G.annT=setTimeout(()=>{if(!G||G.ended)return;
    const a=c.getBoundingClientRect(),b=h.getBoundingClientRect();
    const an=c.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${(b.left+b.width/2)-(a.left+a.width/2)}px),calc(-50% + ${(b.top+b.height/2)-(a.top+a.height/2)}px)) scale(${b.height/a.height})`}],{duration:320,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
    an.onfinish=()=>{c.classList.remove('on');an.cancel();if(!G||G.ended)return;G.annMs+=performance.now()-G.annStart;G.announcing=false;board.classList.remove('dim');hud();h.classList.add('pop');setTimeout(()=>h.classList.remove('pop'),120)};
  },CALL_MS);
}
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.tile');if(!el||!G||!G.running||G.announcing||G.ended)return;
  e.preventDefault();if(performance.now()<G.lock)return;
  const v=+el.dataset.v,t=G.seq[G.idx];
  if(v===t){
    el.classList.add('found');sparkle(el);G.idx++;Snd.ok(G.idx);
    const h=$('#tNum');h.classList.add('pop');setTimeout(()=>h.classList.remove('pop'),120);hud();
    if(G.idx>=G.seq.length){finish();return}
    if(G.mode!=='timed')setTimeout(()=>{if(G&&!G.ended)announce()},250);
  }else{
    G.mis++;Snd.bad();G.lock=performance.now()+WRONG_LOCK;
    el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');
    board.classList.add('lock');setTimeout(()=>board.classList.remove('lock'),WRONG_LOCK);
    const g=$('#game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),450);
    try{navigator.vibrate&&navigator.vibrate(120)}catch(_){}
  }
});
function sparkle(el){
  const r=board.getBoundingClientRect(),b=el.getBoundingClientRect(),cx=b.left+b.width/2-r.left,cy=b.top+b.height/2-r.top;
  const a=document.createElement('div');a.className='star';a.style.left=(cx+b.width*.32)+'px';a.style.top=(cy-b.height*.3)+'px';
  const s=document.createElement('div');s.className='star s2';s.style.left=(cx-b.width*.38)+'px';s.style.top=(cy+b.height*.25)+'px';
  board.append(a,s);setTimeout(()=>{a.remove();s.remove()},650);
}
function stopGame(){if(!G)return;G.running=false;G.ended=true;clearTimeout(G.cd);clearTimeout(G.annT);cancelAnimationFrame(G.raf);$('#callout').classList.remove('on');board.classList.remove('dim')}
$('#bQuit').onclick=()=>{stopGame();G=null;openMenu()};

/* ---------- result → photo → name → leaderboard ---------- */
let pending=null; // score waiting for photo + name
async function finish(){
  const ms=elapsed();stopGame();Snd.win();
  $('#sTime').textContent=(ms/1000).toFixed(2);
  const mode=G.mode;const rank=await rankOf(mode,ms);
  const top=rank<=10;
  const save=S.photo==='all'||top;   // a. top 10 only  b. everyone
  pending=save?{mode,ms,rank,top,mis:G.mis}:null;
  setTimeout(()=>{
    $('#resCard').innerHTML=`
      ${top?`<div class="badge">${rank===1?'NEW RECORD!':'TOP 10 · RANK '+rank}</div>`:''}
      <h2>${top?'AMAZING!':'NICE TRY!'}</h2>
      <div class="muted" style="font-size:20px">${modeName(mode)}</div>
      <div class="score">${(ms/1000).toFixed(2)}<small>s</small></div>
      <div class="muted" style="font-size:18px;margin-bottom:22px">${G.mis} miss${G.mis===1?'':'es'}${top?'':' · Top 10 needs a faster time'}</div>
      <div class="row">${save?`<button class="btn pri" id="rSave">${S.photo==='off'?'ENTER NAME':'TAKE PHOTO'}</button>`:''}<button class="btn ${save?'':'pri'}" id="rAgain">PLAY AGAIN</button><button class="btn" id="rHome">HOME</button></div>`;
    show('result');
    if($('#rSave'))$('#rSave').onclick=()=>S.photo==='off'?openName(null):openPhoto();
    $('#rAgain').onclick=()=>{pending=null;openMenu()};
    $('#rHome').onclick=()=>{pending=null;goLanding()};
  },450);
}

/* camera */
let stream=null,shot=null;
async function openPhoto(){
  show('photo');shot=null;$('#cam').classList.toggle('mirror',S.mirror);
  const v=$('#video');v.style.display='';$('#cam').querySelectorAll('img').forEach(i=>i.remove());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});v.srcObject=stream;camButtons('ready')}
  catch(e){toast('Camera not available — continue without a photo');camButtons('none')}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function camButtons(st){
  const b=$('#camBtns');
  if(st==='ready')b.innerHTML='<button class="btn pri" id="cSnap">TAKE PHOTO</button><button class="btn" id="cSkip">SKIP</button>';
  if(st==='taken')b.innerHTML='<button class="btn pri" id="cUse">USE THIS</button><button class="btn" id="cRetake">RETAKE</button>';
  if(st==='none')b.innerHTML='<button class="btn pri" id="cSkip">CONTINUE</button>';
  if(st==='busy')b.innerHTML='';
  if($('#cSnap'))$('#cSnap').onclick=snap;
  if($('#cSkip'))$('#cSkip').onclick=()=>{stopCam();openName(null)};
  if($('#cUse'))$('#cUse').onclick=()=>{stopCam();openName(shot)};
  if($('#cRetake'))$('#cRetake').onclick=()=>{shot=null;$('#cam').querySelectorAll('img').forEach(i=>i.remove());$('#video').style.display='';camButtons('ready')};
}
function snap(){
  camButtons('busy');let k=3;const cd=$('#camCd');cd.textContent=k;Snd.tick();
  const it=setInterval(()=>{k--;if(k>0){cd.textContent=k;Snd.tick();return}
    clearInterval(it);cd.textContent='';
    const v=$('#video'),s=Math.min(v.videoWidth,v.videoHeight)||480,cv=document.createElement('canvas');cv.width=cv.height=320;
    const ctx=cv.getContext('2d');if(S.mirror){ctx.translate(320,0);ctx.scale(-1,1)}
    ctx.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,320,320);
    shot=cv.toDataURL('image/jpeg',.82);Snd.shutter();
    const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    const im=document.createElement('img');im.src=shot;im.style.position='absolute';im.style.inset='0';$('#cam').appendChild(im);v.style.display='none';
    camButtons('taken');
  },900);
}

/* on-screen keyboard */
let nameVal='',namePhoto=null;
function openName(photo){
  namePhoto=photo;nameVal='';
  show('name');drawName();
  const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  $('#kb').innerHTML=rows.map((r,i)=>`<div class="r">${[...r].map(c=>`<button data-k="${c}">${c}</button>`).join('')}${i===2?'<button data-k="BS" class="w">⌫</button>':''}</div>`).join('')+
    '<div class="r"><button data-k="SP" class="w">SPACE</button><button data-k="OK" class="w ok">SAVE</button></div>';
  $('#kb').querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function drawName(){$('#nameBox').innerHTML=esc(nameVal)+'<span class="cur"></span>'}
function key(k){
  Snd.key();
  if(k==='BS')nameVal=nameVal.slice(0,-1);
  else if(k==='SP'){if(nameVal&&!nameVal.endsWith(' ')&&nameVal.length<12)nameVal+=' '}
  else if(k==='OK'){saveScore();return}
  else if(nameVal.length<12)nameVal+=k;
  drawName();
}
document.addEventListener('keydown',e=>{
  if(current!=='name')return;
  if(e.key==='Enter')key('OK');else if(e.key==='Backspace')key('BS');else if(e.key===' ')key('SP');
  else if(/^[a-z0-9]$/i.test(e.key))key(e.key.toUpperCase());
});
async function saveScore(){
  if(!pending){openLb();return}
  const name=nameVal.trim()||'PLAYER';
  const id=await DB.add({mode:pending.mode,ms:Math.round(pending.ms),name,photo:namePhoto,at:Date.now(),mis:pending.mis});
  const mode=pending.mode;pending=null;
  openLb(mode,id);
}

/* leaderboard */
let lbMode='timed';
async function openLb(mode,hl){
  if(mode)lbMode=mode;show('lb');
  $('#tabs').innerHTML=MODES.map(m=>`<button data-m="${m.id}" class="${m.id===lbMode?'on':''}">${m.name}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openLb(b.dataset.m));
  const rows=await top10(lbMode);
  $('#list').innerHTML=rows.length?rows.map((r,i)=>`<div class="li${r.id===hl?' me':''}"><div class="r">${i+1}</div><div class="ph">${r.photo?`<img src="${r.photo}" alt="">`:esc(r.name[0]||'?')}</div><div class="n">${esc(r.name)}<small>${new Date(r.at).toLocaleDateString()}</small></div><div class="t">${fmtT(r.ms)}</div></div>`).join('')
    :'<div class="empty">No scores yet — be the first!</div>';
  if(hl){const me=$('.li.me');if(me){me.scrollIntoView({block:'center'})}else{toast('Saved! Not in the top 10 this time.')}}
}

/* landing: leader bubbles float up and fade */
let floatT=null,pool=[],poolI=0;
async function startFloaters(){
  stopFloaters();
  pool=[];for(const m of MODES){(await top10(m.id)).forEach((r,i)=>pool.push({...r,rank:i+1}))}
  pool=shuffle(pool,Math.random);poolI=0;
  if(!pool.length)return;
  const spawn=()=>{
    if(current!=='landing')return;
    const r=pool[poolI++%pool.length];
    const sz=Math.round(90+Math.random()*60);
    const el=document.createElement('div');el.className='fb';
    el.style.left=(5+Math.random()*80)+'vw';el.style.setProperty('--sz',sz+'px');el.style.setProperty('--dur',(7+Math.random()*4)+'s');
    el.innerHTML=`<div class="ph">${r.photo?`<img src="${r.photo}" alt="">`:esc(r.name[0]||'?')}<div class="rk">${r.rank}</div></div><div class="nm">${esc(r.name)}<small>${fmtT(r.ms)}</small></div>`;
    $('#floaters').appendChild(el);setTimeout(()=>el.remove(),12000);
    floatT=setTimeout(spawn,1300+Math.random()*900);
  };
  spawn();
}
function stopFloaters(){clearTimeout(floatT);$('#floaters').innerHTML=''}

/* ---------- hidden corners ---------- */
function triple(el,fn){let n=0,t=0;el.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();const now=Date.now();n=(now-t<700)?n+1:1;t=now;if(n>=3){n=0;fn()}})}
triple($('#cornerR'),()=>{renderSettings();$('#settings').classList.add('on')});
triple($('#cornerL'),()=>{
  if(!confirm('Exit the kiosk?'))return;
  stopGame();stopCam();
  try{window.close()}catch(e){}
  if(document.fullscreenElement)document.exitFullscreen?.();
  setTimeout(()=>{document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;font:800 22px var(--font);color:var(--muted)" onclick="location.reload()">Kiosk closed · tap to restart</div>'},150);
});
$('#sDone').onclick=()=>{$('#settings').classList.remove('on');if(current==='landing')startFloaters()};

function sseg(key,opts,lab){return `<div class="seg" data-k="${key}">${opts.map(o=>`<button data-v="${o}" class="${String(S[key])===String(o)?'on':''}">${lab(o)}</button>`).join('')}</div>`}
function renderSettings(){
  $('#sBody').innerHTML=`
    <div class="group full"><div class="lbl">Photo + name after a game</div>${sseg('photo',['top','all','off'],o=>({top:'Top 10 only',all:'Everyone',off:'Name only (top 10)'})[o])}
      <div class="note">Everyone = every player can save a photo, the leaderboard still shows the best 10.</div></div>
    <div class="group"><div class="lbl">Numbers on board</div>${sseg('count',[25,36,50,75],o=>o)}</div>
    <div class="group"><div class="lbl">Rounds (called modes)</div>${sseg('rounds',[1,3,5,10],o=>o)}</div>
    <div class="group"><div class="lbl">Difficulty</div>${sseg('diff',['easy','normal','hard'],o=>o[0].toUpperCase()+o.slice(1))}</div>
    <div class="group"><div class="lbl">Back to landing when idle</div>${sseg('idle',[30,60,120],o=>o+'s')}</div>
    <div class="group"><div class="lbl">Theme</div>${sseg('theme',['bright','dark'],o=>o==='bright'?'Bright':'Dark')}</div>
    <div class="group"><div class="lbl">Sound</div>${sseg('sound',[true,false],o=>o?'On':'Off')}</div>
    <div class="group"><div class="lbl">Mirror camera</div>${sseg('mirror',[true,false],o=>o?'On':'Off')}</div>
    <div class="group"><div class="lbl">Fullscreen</div><div class="seg"><button id="sFs">Toggle</button></div></div>
    <div class="group full"><div class="lbl">Logo</div><div class="seg"><button id="sLogo">${S.logo?'Change logo':'Upload logo'}</button>${S.logo?'<button id="sLogoDel">Remove</button>':''}</div>
      ${S.logo?sseg('logoSize',['s','m','l'],o=>({s:'Small',m:'Medium',l:'Large'})[o]):''}</div>
    <div class="group full"><div class="lbl">Leaderboard</div><div class="seg"><button class="danger" id="sClear">Clear all scores and photos</button></div>
      <div class="note">Clear the board after changing numbers / rounds / difficulty so times stay comparable. Pictures: ${IMAGES.length} found in img/.</div></div>`;
  $('#sBody').querySelectorAll('.seg[data-k] button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(/^\d+$/.test(v))v=+v;S[k]=v;saveS();renderSettings()});
  $('#sLogo').onclick=()=>$('#logoFile').click();
  if($('#sLogoDel'))$('#sLogoDel').onclick=()=>{S.logo=null;saveS();renderSettings()};
  $('#sFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
  $('#sClear').onclick=async()=>{if(!confirm('Delete every score and photo on this kiosk?'))return;await DB.clear();toast('Leaderboard cleared')};
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- boot ---------- */
(async function(){applyS();await DB.open();show('landing')})();
</script>
</body>
